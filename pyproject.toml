[project]
name = "calori-data-fetcher"
version = "0.1.0"
description = "Export selected Calori meals as weekly YAML files."
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["ruamel-yaml"]

[dependency-groups]
dev = ["pyyaml", "ruff", "ty", "types-pyyaml"]

[tool.uv]
package = false
required-version = ">=0.13.0"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ty.environment]
python-version = "3.15"

[tool.ty.src]
include = ["calori.py", "test_calori.py"]
