[project]
name = "calori-optimizer"
version = "0.3.0"
description = "Export selected Calori meals as weekly YAML files."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["pulp[highs]>=4,<5", "ruamel-yaml"]

[dependency-groups]
dev = ["pyyaml", "ruff", "ty", "types-pyyaml"]

[tool.uv]
package = false
required-version = ">=0.13.0"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["calori.py", "test_calori.py"]
